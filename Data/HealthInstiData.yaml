    services:
      - serviceID: 1
        source: null
        service_name: Outpatient Consultation
        service_description: General and specialized medical consultations 
          provided for non-emergency patients.
        requirements:
          - requirement_id: 1
            requirement_description: Valid ID or Patient Blue Card.
          - requirement_id: 2
            requirement_description: Consultation ticket from the triage.
        procedure:
          - step: 1
            instruction: Proceed to the Triage area for initial screening.
          - step: 2
            instruction: Register at the Admitting/OPD desk to get a queue number.
          - step: 3
            instruction: Wait for your number to be called at the respective clinic.
