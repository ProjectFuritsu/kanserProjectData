      - serviceID: 1
        source: null
        service_name: Dialysis Center
        service_description: High-quality renal replacement therapy for patients 
          with chronic kidney disease.
        requirements:
          - requirement_id: 1
            requirement_description: Nephrologist referral/clearance.
          - requirement_id: 2
            requirement_description: Laboratory results (HBsAg, Anti-HCV, Anti-HIV).
