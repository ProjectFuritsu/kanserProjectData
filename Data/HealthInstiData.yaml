  - id: 2
    name: Davao Doctors Hospital
    bgImageURL: https://ddh.com.ph/wp-content/uploads/2023/01/DDH-Building.jpg
    source: https://ddh.com.ph/
    description: Davao Doctors Hospital (DDH) is a privately-owned, tertiary level 
      and multi-specialty hospital in Davao City. It is the largest and most 
      modern hospital in the Davao Region, offering state-of-the-art diagnostic 
      and intensive care facilities.
    type: Private Institution
    location: 118 Elpidio Quirino Ave, Poblacion District, Davao City
    latitude: 7.0678
    longitude: 125.6061
    schedule:
      isWholeWeek: true
      days:
        - day: Monday-Sunday
          timeIn: 12:00 am
          timeOut: 11:59 pm
    contacts:
      - contact_id: 1
        type: Landline
        contact_details: (082) 222-8000
      - contact_id: 2
        type: Email
        contact_details: info@ddh.com.ph
    services:
      - serviceID: 1
        source: null
        service_name: Executive Check-up
        service_description: Comprehensive health screening packages tailored for 
          early detection of lifestyle diseases and general wellness.
        requirements:
          - requirement_id: 1
            requirement_description: Prior appointment booking.
          - requirement_id: 2
            requirement_description: Fasting for at least 8-10 hours.
        procedure:
          - step: 1
            instruction: Book an appointment via the DDH website or concierge.
          - step: 2
            instruction: Arrive at the Wellness Center at the scheduled time.
          - step: 3
            instruction: Proceed with diagnostic tests and physician consultation.

